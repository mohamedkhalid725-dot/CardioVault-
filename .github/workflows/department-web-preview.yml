name: CardioVault Department Web Preview

on:
  push:
    branches:
      - department-system-v1
    paths:
      - src/**
      - public/**
      - index.html
      - package.json
      - package-lock.json
      - vite.config.ts
      - firebase.json
      - .github/workflows/department-web-preview.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cardiovault-department-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: cardiovault-department-preview
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Configure Firebase Web app
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT is required for the department web preview."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          npx firebase-tools@latest apps:list --project ccu-notebook --non-interactive --json > "$RUNNER_TEMP/firebase-apps.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path(os.environ["RUNNER_TEMP"]+"/firebase-apps.json").read_text())
          result=data.get("result",data)
          apps=result if isinstance(result,list) else result.get("apps",[])
          web=next((a for a in apps if str(a.get("platform","")).upper()=="WEB"),None)
          if not web or not web.get("appId"):
              raise SystemExit("No Firebase Web App is registered in ccu-notebook.")
          Path(os.environ["RUNNER_TEMP"]+"/web-app-id.txt").write_text(web["appId"])
          PY
          WEB_APP_ID=$(cat "$RUNNER_TEMP/web-app-id.txt")
          npx firebase-tools@latest apps:sdkconfig WEB "$WEB_APP_ID" --project ccu-notebook --non-interactive --json > "$RUNNER_TEMP/firebase-web-config.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path(os.environ["RUNNER_TEMP"]+"/firebase-web-config.json").read_text())
          cfg=data.get("result",data)
          if isinstance(cfg,dict) and "config" in cfg: cfg=cfg["config"]
          required=["apiKey","authDomain","projectId","storageBucket","messagingSenderId","appId"]
          missing=[k for k in required if not cfg.get(k)]
          if missing: raise SystemExit("Firebase Web config missing: "+", ".join(missing))
          lines=[
            "VITE_FIREBASE_API_KEY="+cfg["apiKey"],
            "VITE_FIREBASE_AUTH_DOMAIN="+cfg["authDomain"],
            "VITE_FIREBASE_PROJECT_ID="+cfg["projectId"],
            "VITE_FIREBASE_STORAGE_BUCKET="+cfg["storageBucket"],
            "VITE_FIREBASE_MESSAGING_SENDER_ID="+cfg["messagingSenderId"],
            "VITE_FIREBASE_APP_ID="+cfg["appId"],
          ]
          Path(".env.production").write_text("\n".join(lines)+"\n")
          print("Firebase Web configuration loaded for app:",cfg["appId"])
          PY

      - name: Build department web app
        run: npm run build

      - name: Deploy department preview channel
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT is required for the department web preview."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          npx firebase-tools@latest hosting:channel:deploy department-system-v1 --project ccu-notebook --non-interactive --json > "$RUNNER_TEMP/firebase-preview.json" 2> "$RUNNER_TEMP/firebase-preview.err" || {
            echo "Firebase Hosting deploy failed. CLI stdout:"
            cat "$RUNNER_TEMP/firebase-preview.json" || true
            echo "Firebase Hosting deploy failed. CLI stderr:"
            cat "$RUNNER_TEMP/firebase-preview.err" || true
            exit 1
          }
          cat "$RUNNER_TEMP/firebase-preview.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"]) / "firebase-preview.json"
          data=json.loads(p.read_text())
          urls=[]
          def walk(v):
              if isinstance(v, dict):
                  for k,x in v.items():
                      if k.lower() in {"url","url_"} and isinstance(x,str) and ".web.app" in x:
                          urls.append(x)
                      walk(x)
              elif isinstance(v,list):
                  for x in v: walk(x)
          walk(data)
          if not urls:
              raise SystemExit("Firebase deploy succeeded but no preview URL was returned.")
          url=urls[-1]
          print("Department preview URL:", url)
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write("url="+url+"\n")
          PY

      - name: Publish preview URL
        run: |
          echo "Department preview is deployed."
