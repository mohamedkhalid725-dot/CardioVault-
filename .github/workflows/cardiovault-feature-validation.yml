name: CardioVault feature validation

on:
  push:
    branches: [fix/firebase-ai-voice-summary]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run lint
      - name: Production web build
        run: npm run build
      - name: Validate Firebase AI handlers
        run: |
          node --check functions/index.js
          node --check functions/ai.js
          node -e "const c=require('./firebase.json'); const rewrites=c.hosting.rewrites; for (const [source,functionId] of [['/api/ai/scan-lab','scanLab'],['/api/ai/transcribe-clinical','transcribeClinical']]) { if (!rewrites.some(r=>r.source===source && r.function.functionId===functionId)) throw new Error('Missing Firebase rewrite: '+source); } console.log('Firebase AI Hosting rewrites are valid.');"
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Add Android platform
        run: npx cap add android
      - name: Configure Firebase Android
        run: cp google-services.json android/app/google-services.json
      - name: Sync and configure Android
        run: |
          npx cap sync android
          python - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          for permission in ('android.permission.INTERNET','android.permission.RECORD_AUDIO'):
              if permission not in s:
                  s=s.replace('</manifest>', f'    <uses-permission android:name="{permission}" />\n</manifest>')
          p.write_text(s)
          PY
      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CardioVault-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: CardioVault-web-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
