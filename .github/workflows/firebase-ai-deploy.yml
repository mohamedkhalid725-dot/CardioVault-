name: Deploy CardioVault AI Backend (Cloudflare)

on:
  workflow_dispatch:
  push:
    branches: [main, department-system-v1]
    paths:
      - 'workers/ai/**'
      - 'src/services/aiClinicalService.ts'
      - '.github/workflows/firebase-ai-deploy.yml'

permissions:
  contents: read

jobs:
  deploy-ai-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Worker source
        working-directory: workers/ai
        run: node --check index.js

      - name: Deploy CardioVault AI Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/ai
          wranglerVersion: '4'
          secrets: |
            GEMINI_API_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
