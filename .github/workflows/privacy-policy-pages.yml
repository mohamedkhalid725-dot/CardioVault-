name: CardioVault Web App Build

on:
  push:
    branches:
      - main
      - department-system-v1
    paths:
      - src/**
      - public/**
      - index.html
      - package.json
      - vite.config.ts
      - .github/workflows/privacy-policy-pages.yml
      - privacy-policy.html
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build CardioVault Web App
        run: npm run build

      - name: Add Privacy Policy
        run: cp privacy-policy.html dist/privacy-policy.html

      - name: Upload Web App artifact
        uses: actions/upload-artifact@v4
        with:
          name: CardioVault-web-pages-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14
