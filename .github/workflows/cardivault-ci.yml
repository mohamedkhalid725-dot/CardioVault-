name: CardioVault CI + Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run lint
      - name: Production web build
        run: npm run build
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Add Android platform
        run: npx cap add android
      - name: Configure Firebase Android
        run: |
          cp google-services.json android/app/google-services.json
          python - <<'PY'
          from pathlib import Path
          p=Path('android/variables.gradle')
          s=p.read_text()
          if 'rgcfaIncludeGoogle' not in s:
              s=s.replace('ext {', "ext {\n    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = '1.3.0'")
          p.write_text(s)
          p=Path('android/build.gradle')
          s=p.read_text()
          if 'com.google.gms:google-services' not in s:
              s=s.replace('dependencies {', "dependencies {\n        classpath 'com.google.gms:google-services:4.5.0'")
          p.write_text(s)
          p=Path('android/app/build.gradle')
          s=p.read_text()
          if "com.google.gms.google-services" not in s:
              s=s.replace('apply plugin:', "apply plugin: 'com.google.gms.google-services'\napply plugin:", 1)
          p.write_text(s)
          PY
      - name: Prepare CardioVault launcher icon
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rm -rf assets
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 public/cardiovault-logo.svg -o assets/icon.png
          cp assets/icon.png assets/icon-only.png
          cp assets/icon.png assets/icon-foreground.png
          npx @capacitor/assets@latest generate --android
      - name: Sync Capacitor Android project
        run: npx cap sync android
      - name: Show APK signing certificate
        working-directory: android
        run: ./gradlew signingReport --no-daemon
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload CardioVault APK
        uses: actions/upload-artifact@v4
        with:
          name: CardioVault-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

