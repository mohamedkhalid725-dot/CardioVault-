name: CardioVault CI + Android APK

on:
  push:
    branches: [main, department-system-v1]
  pull_request:
    branches: [main, department-system-v1]
  workflow_dispatch:

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
  HAS_CARDIOVAULT_DEBUG_KEYSTORE: ${{ secrets.CARDIOVAULT_DEBUG_KEYSTORE_BASE64 }}
  HAS_CARDIOVAULT_RELEASE_KEYSTORE: ${{ secrets.CARDIOVAULT_RELEASE_KEYSTORE_BASE64 }}
  HAS_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run lint
      - name: Production web build
        run: npm run build
      - name: Validate Firebase AI backend
        working-directory: functions
        run: |
          npm install
          node --check index.js
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Add Android platform
        run: npx cap add android
      - name: Configure Firebase Android
        run: |
          # Prefer a real Android google-services.json when one is available.
          # Otherwise generate a CI-safe Firebase config from the project's public
          # Firebase web configuration so the Android build is not blocked by a
          # broken/missing service-account secret.
          if [ -f google-services.json ]; then
            echo "Using repository google-services.json"
          else
            echo "Generating CI-safe google-services.json for com.cardiovault.app"
            cat > google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "963615758407",
              "project_id": "ccu-notebook",
              "storage_bucket": "ccu-notebook.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:963615758407:android:c4rd10v4ult",
                  "android_client_info": {
                    "package_name": "com.cardiovault.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyCegfOjWEsNwrz96L6UFlbXsODzVs1jFpQ"
                  }
                ],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi
          cp google-services.json android/app/google-services.json
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('google-services.json').read_text())
          clients=cfg.get('client',[])
          android=[c for c in clients if c.get('client_info',{}).get('android_client_info',{}).get('package_name')=='com.cardiovault.app']
          if not android:
              raise SystemExit('Firebase config does not contain the Android package com.cardiovault.app')
          if not cfg.get('project_info',{}).get('project_id'):
              raise SystemExit('Firebase config is missing project_id')
          if not android[0].get('api_key'):
              raise SystemExit('Firebase config is missing an Android API key')
          p=Path('android/variables.gradle')
          s=p.read_text()
          if 'rgcfaIncludeGoogle' not in s:
              s=s.replace('ext {', "ext {\n    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = '1.3.0'")
          p.write_text(s)
          p=Path('android/build.gradle')
          s=p.read_text()
          if 'com.google.gms:google-services' not in s:
              s=s.replace('dependencies {', "dependencies {\n        classpath 'com.google.gms:google-services:4.5.0'")
          p.write_text(s)
          p=Path('android/app/build.gradle')
          s=p.read_text()
          if "com.google.gms.google-services" not in s:
              s=s.replace('apply plugin:', "apply plugin: 'com.google.gms.google-services'\napply plugin:", 1)
          p.write_text(s)
          PY
          npx cap update android
      - name: Prepare Firebase Android SHA registration
        if: ${{ env.HAS_FIREBASE_SERVICE_ACCOUNT != '' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        working-directory: android
        run: |
          # SHA registration is performed after CI signing configs are added.
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('app/google-services.json').read_text())
          for client in cfg.get('client',[]):
              info=client.get('client_info',{})
              if info.get('android_client_info',{}).get('package_name') == 'com.cardiovault.app':
                  print('Firebase Android App ID:', info.get('mobilesdk_app_id',''))
                  break
          PY
      - name: Deploy Firestore rules
        # Deploy after the GitHub deploy service account has Firebase Rules Admin permission.
        if: ${{ env.HAS_FIREBASE_SERVICE_ACCOUNT != '' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          npx firebase-tools@latest deploy --only firestore:rules --project ccu-notebook --non-interactive --config firebase.json
      # Firebase Authentication providers are managed in Firebase Console.
      # The CLI auth deploy currently requires listing Firebase Web apps, which this CI
      # service account does not have permission to do. Keeping auth deployment out of
      # the build prevents an unrelated provider-management permission from blocking APKs.

      - name: Prepare CardioVault launcher icon
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rm -rf assets
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 public/cardiovault-logo.svg -o assets/icon.png
          cp assets/icon.png assets/icon-only.png
          cp assets/icon.png assets/icon-foreground.png
          npx @capacitor/assets@latest generate --android
      - name: Sync Capacitor Android project
        run: npx cap sync android
      - name: Harden Android auth/network manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          if 'android.permission.INTERNET' not in s:
              s=s.replace('</manifest>', '    <uses-permission android:name="android.permission.INTERNET" />\n</manifest>')
          if 'android.permission.RECORD_AUDIO' not in s:
              s=s.replace('</manifest>', '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n</manifest>')
          if 'android:name=".MainActivity"' in s and 'android:launchMode="singleTask"' not in s:
              s=s.replace('android:name=".MainActivity"', 'android:name=".MainActivity"\n            android:launchMode="singleTask"')
          p.write_text(s)
          PY
      - name: Configure stable debug signing when provided
        if: ${{ env.HAS_CARDIOVAULT_DEBUG_KEYSTORE != '' }}
        env:
          CARDIOVAULT_DEBUG_KEYSTORE_BASE64: ${{ secrets.CARDIOVAULT_DEBUG_KEYSTORE_BASE64 }}
          CARDIOVAULT_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.CARDIOVAULT_DEBUG_KEYSTORE_PASSWORD }}
          CARDIOVAULT_DEBUG_KEY_ALIAS: ${{ secrets.CARDIOVAULT_DEBUG_KEY_ALIAS }}
          CARDIOVAULT_DEBUG_KEY_PASSWORD: ${{ secrets.CARDIOVAULT_DEBUG_KEY_PASSWORD }}
        run: |
          echo "$CARDIOVAULT_DEBUG_KEYSTORE_BASE64" | base64 --decode > android/cardiovault-debug.keystore
          cat >> android/app/build.gradle <<'GRADLE'
          def cardiovaultDebugKeystore = rootProject.file('cardiovault-debug.keystore')
          if (cardiovaultDebugKeystore.exists()) {
              android {
                  signingConfigs {
                      cardiovaultDebug {
                          storeFile cardiovaultDebugKeystore
                          storePassword System.getenv('CARDIOVAULT_DEBUG_KEYSTORE_PASSWORD')
                          keyAlias System.getenv('CARDIOVAULT_DEBUG_KEY_ALIAS')
                          keyPassword System.getenv('CARDIOVAULT_DEBUG_KEY_PASSWORD')
                      }
                  }
                  buildTypes {
                      debug { signingConfig signingConfigs.cardiovaultDebug }
                  }
              }
          }
          GRADLE
      - name: Configure CardioVault release signing when provided
        if: ${{ env.HAS_CARDIOVAULT_RELEASE_KEYSTORE != '' }}
        env:
          CARDIOVAULT_RELEASE_KEYSTORE_BASE64: ${{ secrets.CARDIOVAULT_RELEASE_KEYSTORE_BASE64 }}
          CARDIOVAULT_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.CARDIOVAULT_RELEASE_KEYSTORE_PASSWORD }}
          CARDIOVAULT_RELEASE_KEY_ALIAS: ${{ secrets.CARDIOVAULT_RELEASE_KEY_ALIAS }}
          CARDIOVAULT_RELEASE_KEY_PASSWORD: ${{ secrets.CARDIOVAULT_RELEASE_KEY_PASSWORD }}
        run: |
          echo "$CARDIOVAULT_RELEASE_KEYSTORE_BASE64" | base64 --decode > android/cardiovault-release.keystore
          cat >> android/app/build.gradle <<'GRADLE'
          def cardiovaultReleaseKeystore = rootProject.file('cardiovault-release.keystore')
          if (cardiovaultReleaseKeystore.exists()) {
              android {
                  signingConfigs {
                      cardiovaultRelease {
                          storeFile cardiovaultReleaseKeystore
                          storePassword System.getenv('CARDIOVAULT_RELEASE_KEYSTORE_PASSWORD')
                          keyAlias System.getenv('CARDIOVAULT_RELEASE_KEY_ALIAS')
                          keyPassword System.getenv('CARDIOVAULT_RELEASE_KEY_PASSWORD')
                      }
                  }
                  buildTypes {
                      release { signingConfig signingConfigs.cardiovaultRelease }
                  }
              }
          }
          GRADLE
      - name: Register Android SHA-1 fingerprints for Google Sign-In
        if: ${{ env.HAS_FIREBASE_SERVICE_ACCOUNT != '' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CARDIOVAULT_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.CARDIOVAULT_DEBUG_KEYSTORE_PASSWORD }}
          CARDIOVAULT_DEBUG_KEY_ALIAS: ${{ secrets.CARDIOVAULT_DEBUG_KEY_ALIAS }}
          CARDIOVAULT_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.CARDIOVAULT_RELEASE_KEYSTORE_PASSWORD }}
          CARDIOVAULT_RELEASE_KEY_ALIAS: ${{ secrets.CARDIOVAULT_RELEASE_KEY_ALIAS }}
        working-directory: android
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          APP_ID=$(python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('app/google-services.json').read_text())
          for client in cfg.get('client',[]):
              info=client.get('client_info',{})
              if info.get('android_client_info',{}).get('package_name') == 'com.cardiovault.app':
                  print(info.get('mobilesdk_app_id',''))
                  break
          PY
          )
          if [ -z "$APP_ID" ]; then exit 1; fi
          rm -f "$RUNNER_TEMP/shas.txt"
          touch "$RUNNER_TEMP/shas.txt"
          if [ -f cardiovault-debug.keystore ]; then
            keytool -list -v -keystore cardiovault-debug.keystore -storepass "$CARDIOVAULT_DEBUG_KEYSTORE_PASSWORD" -alias "$CARDIOVAULT_DEBUG_KEY_ALIAS" 2>/dev/null | sed -n 's/^[[:space:]]*SHA1:[[:space:]]*//p' >> "$RUNNER_TEMP/shas.txt" || true
          fi
          if [ -f cardiovault-release.keystore ]; then
            keytool -list -v -keystore cardiovault-release.keystore -storepass "$CARDIOVAULT_RELEASE_KEYSTORE_PASSWORD" -alias "$CARDIOVAULT_RELEASE_KEY_ALIAS" 2>/dev/null | sed -n 's/^[[:space:]]*SHA1:[[:space:]]*//p' >> "$RUNNER_TEMP/shas.txt" || true
          fi
          if [ -f "$HOME/.android/debug.keystore" ]; then
            keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey 2>/dev/null | sed -n 's/^[[:space:]]*SHA1:[[:space:]]*//p' >> "$RUNNER_TEMP/shas.txt" || true
          fi
          mapfile -t SHAS < <(sed '/^[[:space:]]*$/d' "$RUNNER_TEMP/shas.txt" | sort -u)
          echo "Detected Android SHA-1 fingerprints: ${#SHAS[@]}"
          if [ "${#SHAS[@]}" -eq 0 ]; then
            echo "No signing SHA-1 could be extracted; continuing with the repository Firebase config."
            exit 0
          fi
          for SHA in "${SHAS[@]}"; do
            echo "Registering Android SHA-1: $SHA"
            npx firebase-tools@latest apps:android:sha:create "$APP_ID" "$SHA" --project ccu-notebook --non-interactive || true
          done
          npx firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project ccu-notebook -o app/google-services.json
          echo "Firebase Android google-services.json refreshed."
      - name: Show Android/Firebase signing diagnostics
        working-directory: android
        run: |
          echo '--- Firebase Android package ---'
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('app/google-services.json').read_text())
          for c in cfg.get('client',[]):
              info=c.get('client_info',{}).get('android_client_info',{})
              if info.get('package_name')=='com.cardiovault.app':
                  print('package:', info.get('package_name'))
                  for o in c.get('oauth_client',[]):
                      ai=o.get('android_info',{})
                      if ai:
                          print('registered certificate SHA1:', ai.get('certificate_hash','').upper())
          PY
          echo '--- Gradle signing report ---'
          ./gradlew signingReport --no-daemon
      - name: Configure hardened Android release build
        working-directory: android
        run: |
          cat >> app/build.gradle <<'GRADLE'
          android {
              buildTypes {
                  release {
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }
          GRADLE
          cat >> app/proguard-rules.pro <<'PROGUARD'
          # Facebook authentication classes are optional in the Capacitor Firebase plugin.
          # CardioVault enables Google authentication only, so these absent optional classes
          # must not make the release shrinker fail.
          -dontwarn com.facebook.**
          PROGUARD
      - name: Build hardened release bundle and APK
        working-directory: android
        env:
          CARDIOVAULT_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.CARDIOVAULT_RELEASE_KEYSTORE_PASSWORD }}
          CARDIOVAULT_RELEASE_KEY_ALIAS: ${{ secrets.CARDIOVAULT_RELEASE_KEY_ALIAS }}
          CARDIOVAULT_RELEASE_KEY_PASSWORD: ${{ secrets.CARDIOVAULT_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Build debug APK
        working-directory: android
        env:
          CARDIOVAULT_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.CARDIOVAULT_DEBUG_KEYSTORE_PASSWORD }}
          CARDIOVAULT_DEBUG_KEY_ALIAS: ${{ secrets.CARDIOVAULT_DEBUG_KEY_ALIAS }}
          CARDIOVAULT_DEBUG_KEY_PASSWORD: ${{ secrets.CARDIOVAULT_DEBUG_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon
      - name: Verify final APK certificate and network permission
        working-directory: android
        run: |
          echo '--- Release APK signing status ---'
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            if [ "$HAS_CARDIOVAULT_RELEASE_KEYSTORE" != "" ]; then
              "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
            else
              echo 'Release APK is unsigned because CARDIOVAULT_RELEASE_KEYSTORE_BASE64 is not configured.'
            fi
          fi
          echo '--- Debug APK certificate ---'
          keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk | grep -E 'Owner:|SHA1:|SHA256:' || true
          echo '--- required permissions ---'
          grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml && echo 'INTERNET permission: OK' || (echo 'INTERNET permission: MISSING' && exit 1)
          grep -q 'android.permission.RECORD_AUDIO' app/src/main/AndroidManifest.xml && echo 'RECORD_AUDIO permission: OK' || (echo 'RECORD_AUDIO permission: MISSING' && exit 1)
      - name: Label release artifact
        run: |
          if [ "$HAS_CARDIOVAULT_RELEASE_KEYSTORE" != "" ]; then
            echo "CARDIOVAULT_RELEASE_ARTIFACT=CardioVault-release-signed-apk" >> "$GITHUB_ENV"
          else
            echo "CARDIOVAULT_RELEASE_ARTIFACT=CardioVault-release-unsigned-apk" >> "$GITHUB_ENV"
          fi
      - name: Upload hardened release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CARDIOVAULT_RELEASE_ARTIFACT }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload CardioVault Web App
        uses: actions/upload-artifact@v4
        with:
          name: CardioVault-web-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14

      - name: Upload CardioVault debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CardioVault-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
