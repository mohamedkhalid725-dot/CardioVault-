name: Full Git History Secret Scan

on:
  workflow_dispatch:
  push:
    branches:
      - phase2-security-review
    paths:
      - .github/workflows/secret-scan.yml

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.18.4"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan all git history
        shell: bash
        run: |
          set +e
          gitleaks detect             --source .             --log-opts="--all"             --redact             --report-format sarif             --report-path gitleaks-report.sarif             --log-level error
          status=$?
          echo "GITLEAKS_EXIT_CODE=$status" >> "$GITHUB_ENV"
          exit $status

      - name: Redact SARIF report
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("gitleaks-report.sarif")
          if not p.exists():
              raise SystemExit(0)

          data = json.loads(p.read_text())
          for run in data.get("runs", []):
              for result in run.get("results", []):
                  result.pop("fingerprints", None)
                  result.pop("partialFingerprints", None)
                  result.pop("codeFlows", None)
                  for loc in result.get("locations", []):
                      physical = loc.get("physicalLocation", {})
                      region = physical.get("region", {})
                      region.pop("snippet", None)
                      region.pop("contextRegion", None)
          p.write_text(json.dumps(data, indent=2))
          PY

      - name: Upload redacted report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif
          if-no-files-found: ignore
