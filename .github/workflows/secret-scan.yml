name: Full Git History Secret Scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks full-history scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --redact --report-format sarif --report-path gitleaks-report.sarif --log-level error

      - name: Redact SARIF report
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("gitleaks-report.sarif")
          if not p.exists():
              raise SystemExit(0)

          data = json.loads(p.read_text())
          for run in data.get("runs", []):
              for result in run.get("results", []):
                  result.pop("fingerprints", None)
                  result.pop("partialFingerprints", None)
                  result.pop("codeFlows", None)
                  for loc in result.get("locations", []):
                      region = loc.get("physicalLocation", {}).get("region", {})
                      for key in ("snippet", "contextRegion"):
                          region.pop(key, None)
          p.write_text(json.dumps(data, indent=2))
          PY

      - name: Upload redacted report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif
          if-no-files-found: ignore
