# CardioVault voice proxy (Cloudflare Worker). Android-only; web uses Firebase AI Logic.
name = "cardiovault-voice-proxy"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# Gemini model default (SAME as the web app: src/config/aiConfig.ts AI_MODEL).
# To use another model, edit this value and redeploy (do NOT set it as a
# secret: plain vars shadow secrets of the same name).
GEMINI_MODEL = "gemini-3.6-flash"
# Comma-separated extra origins allowed to call POST /transcribe.
# The worker always allows *.web.app, *.firebaseapp.com, https://localhost
# and http://localhost (Capacitor Android origins). To add more, edit
# ALLOWED_ORIGINS here and redeploy (do NOT set it as a secret).
# OPTIONAL fallback model: tried ONCE when the primary model still fails
# with 429/500/503 after its retries. Empty by default (behavior unchanged).
# Plain var only — never set a secret with this name (plain vars shadow
# secrets of the same name).
GEMINI_FALLBACK_MODEL = ""

# Rate-limit store: create it manually, then paste the id below.
#   wrangler kv:namespace create VOICE_RL
[[kv_namespaces]]
binding = "VOICE_RL"
id = "c37da0ebd5b948c785f26193256dafd2"
